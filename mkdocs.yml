site_name: SME ModbusSim
site_url: https://smartedge-tech-dev.github.io/sme-modbus-sim/
site_description: Free, open-source Modbus slave (server) simulator with a live web UI for Windows, Linux and Docker. Modbus TCP, RTU, ASCII, UDP and TLS; test an EMS, SCADA or gateway without real devices.
repo_url: https://github.com/smartedge-tech-dev/sme-modbus-sim
repo_name: smartedge-tech-dev/sme-modbus-sim
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          site_description: 無料・オープンソースの Modbus スレーブ（サーバー）シミュレーター。Windows / Linux / Docker で動作し、Modbus TCP・RTU・ASCII・UDP・TLS に対応。実機なしで EMS・SCADA・ゲートウェイを試験できます。
          nav_translations:
            Home: ホーム
            Getting started: はじめに
            Configuration: 設定
            Reference: リファレンス
            About: 概要
        - locale: zh
          name: 简体中文
          build: true
          site_description: 免费开源的 Modbus 从站（Slave / Server）模拟器，带实时 Web UI，支持 Windows、Linux 和 Docker。支持 Modbus TCP、RTU、ASCII、UDP 和 TLS，无需真实设备即可测试 EMS、SCADA 或网关。
          nav_translations:
            Home: 首页
            Getting started: 快速入门
            Configuration: 配置
            Reference: 参考
            About: 关于

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

nav:
  - Home: index.md
  - Getting started:
      - quick-start.md
  - Configuration:
      - configuration.md
      - behaviors-templates.md
      - excel.md
      - faults.md
      - device-management.md
  - Reference:
      - http-api.md
      - changelog.md
      - development.md
  - About:
      - commercial-support.md
      - license.md
