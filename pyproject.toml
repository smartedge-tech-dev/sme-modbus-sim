[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-modbus-sim"
dynamic = ["version"]
description = "SME ModbusSim: a free Modbus TCP / RTU over TCP device simulator with a web UI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["modbus", "simulator", "energy-management", "ems", "bess"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Hardware",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "pydantic>=2",
  "pyserial>=3.5",
  "sme-sim-common[xlsx]>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pymodbus==3.16.2"]

[project.urls]
Homepage = "https://github.com/smartedge-tech-dev/sme-modbus-sim"

[project.scripts]
sme-modbus-sim = "sme_modbus_sim.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "sme_modbus_sim.__version__" }

[tool.setuptools.packages.find]
include = ["sme_modbus_sim*"]

[tool.setuptools.package-data]
sme_modbus_sim = ["static/**/*", "data/sunspec/*"]
